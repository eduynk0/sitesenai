<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locais - Senai Food</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ======== BARRA LATERAL ======== -->
  <aside class="site-sidebar">
    <div class="sidebar-logo">
      <a href="index.html">
        <img src="img/logo.png" alt="Senai Food Logo" width="180">
      </a>
      <h1>Senai Food</h1>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li><button class="nav-btn" data-action="inicio">Início</button></li>
        <li><button class="nav-btn" data-action="sobre">Sobre</button></li>
        <li><button class="nav-btn" data-action="locais">Locais</button></li>
        <li><button class="nav-btn" data-action="carrinho">Carrinho <span id="cart-count">0</span></button></li>
        <li><button id="zap">Contato</button></li>
      </ul>
    </nav>
  </aside>

  <!-- ======== CONTEÚDO PRINCIPAL ======== -->
  <div class="main-content">
    <h2 class="menu-title">Nossos Locais</h2>

    <section class="locais-section">
      <p class="descricao">
        Você pode nos encontrar em nossa unidade localizada no <strong>Colégio SESI Pinhais</strong>!
      </p>
      <p class="descricao">
        Endereço: <strong>R. Quinze de Outubro, 1207 - Centro, Pinhais - PR, 83323-040</strong>
      </p>

      <!-- MAPA DO GOOGLE -->
      <div class="mapa-container">
        <iframe
          src="https://www.google.com/maps?q=R.%20Quinze%20de%20Outubro%2C%201207%20-%20Centro%2C%20Pinhais%20-%20PR%2C%2083323-040&output=embed"
          width="100%"
          height="450"
          style="border:0; border-radius: 15px;"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </section>

    <footer>
      <p>&copy; 2025 Senai Food - Todos os direitos reservados</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
