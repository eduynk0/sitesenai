<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senai Food</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="site-sidebar">
  <div class="sidebar-logo">
    <img src="img/logo.png" alt="Senai Food Logo" width="200">
    <h1>Senai Food</h1>
  </div>

  <!-- BARRA LATERAL -->
  <nav class="sidebar-nav">
    <ul>
      <li>
        <button class="nav-btn" data-action="sobre">Sobre</button>
      </li>
      <li>
        <button class="nav-btn" data-action="locais">Locais</button>
      </li>
      <li>
        <button class="nav-btn" data-action="carrinho">
          Carrinho <span id="cart-count">0</span>
        </button>
      </li>
      <li>
        <button id="zap"> Contato </button>
      </li>
    </ul>
  </nav>
</aside>

<div class="main-content">
  <h2 class="menu-title">Cardápio</h2>

  <main>
    <div class="item">
      <a href="sushi.html" class="product" data-name="Sushi">
        <img src="img/sushi.png" alt="Sushi" width="200">
        <p>Sushi</p>
      </a>
      <button class="add-cart" data-name="Sushi">Adicionar ao carrinho</button>
    </div>

    <div class="item">
      <a href="ramen.html" class="product" data-name="Râmen">
        <img src="img/ramen.png" alt="Ramen" width="200">
        <p>Râmen</p>
      </a>
      <button class="add-cart" data-name="Râmen">Adicionar ao carrinho</button>
    </div>

    <div class="item">
      <a href="yakisoba.html" class="product" data-name="Yakisoba">
        <img src="img/yakisoba.png" alt="Yakisoba" width="200">
        <p>Yakisoba</p>
      </a>
      <button class="add-cart" data-name="Yakisoba">Adicionar ao carrinho</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Senai Food - Todos os direitos reservados</p>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
